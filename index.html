<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAFAN.DEV</title>
  <meta name="description" content="Val — I build games and apps." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet" />
  <style>
    :root {
      --board: #262427;
      --chalk: #f7f5ef;
      --chalk-dim: rgba(247, 245, 239, 0.6);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      font-family: 'Schoolbell', cursive;
      background: var(--board);
      color: var(--chalk);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 4vh, 2.5rem);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    /* staggered entrance */
    body > * {
      animation: rise 0.7s var(--spring) both;
      animation-delay: calc(var(--i) * 0.1s);
    }

    /* ---------- intro ---------- */
    .portrait {
      position: relative;
      width: clamp(140px, 24vh, 200px);
      aspect-ratio: 1;
      isolation: isolate;
    }

    /* loose chalk outline drifting around the portrait, out of sync with it */
    .portrait::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -1;
      border: 2px dashed var(--chalk-dim);
      border-radius: 55% 45% 42% 58% / 44% 55% 45% 56%;
      animation: morph 7s ease-in-out infinite alternate-reverse, spin 40s linear infinite;
      transition: inset 0.4s var(--spring), border-color 0.3s;
    }

    .portrait:hover::before {
      inset: -16px;
      border-color: var(--chalk);
    }

    .portrait > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 3px solid var(--chalk);
      border-radius: 42% 58% 55% 45% / 52% 44% 56% 48%;
      animation: morph 10s ease-in-out infinite alternate;
    }

    .badge {
      position: absolute;
      left: -10%;
      bottom: -6%;
      width: 34%;
      transform: rotate(-8deg);
      cursor: help;
    }

    .badge img {
      display: block;
      width: 100%;
      transition: transform 0.3s var(--spring);
    }

    .badge:hover img { transform: scale(1.15) rotate(8deg); }

    .badge-tip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      background: var(--chalk);
      color: var(--board);
      padding: 0.2rem 0.7rem;
      border-radius: 12px;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-50%) scale(0.6);
      transition: opacity 0.2s, transform 0.3s var(--spring);
      pointer-events: none;
    }

    .badge:hover .badge-tip {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.4vh, 1.3rem);
      color: var(--chalk-dim);
      margin-top: -0.75rem;
    }

    /* ---------- projects: fanned cards (after WikiFighters' launch cards) ---------- */
    .projects {
      display: flex;
      justify-content: center;
      gap: clamp(0.6rem, 2.5vw, 1.25rem);
      padding-top: 0.5rem;
    }

    .project {
      /* --off: position from the center card, sets the fan tilt + arc */
      --abs: max(var(--off), -1 * var(--off));
      position: relative;
      width: clamp(96px, 26vw, 160px);
      aspect-ratio: 3 / 4;
      border-radius: 18px;
      overflow: hidden;
      color: var(--chalk);
      text-decoration: none;
      text-align: left;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45);
      rotate: calc(var(--off) * 4deg);
      translate: 0 calc(var(--abs) * 12px);
      transition: transform 0.3s var(--spring), rotate 0.3s var(--spring), box-shadow 0.3s;
    }

    /* chalk bevel on top of everything */
    .project::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 2px var(--chalk-dim), inset 0 1px 0 var(--chalk);
      pointer-events: none;
    }

    .project img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s var(--spring), filter 0.3s;
    }

    /* bottom fade for the title, plus a light sweep on hover */
    .project::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.1) 50%, transparent 65%) -200% 0 / 200% 100% no-repeat,
        linear-gradient(transparent 45%, rgba(0, 0, 0, 0.85));
      transition: background-position 0s;
    }

    .project-info {
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      bottom: 0.7rem;
      z-index: 2;
      line-height: 1.1;
    }

    .project-info h3 {
      font-size: clamp(0.95rem, 3vw, 1.2rem);
      font-weight: 400;
      text-shadow: 0 2px 6px #000;
    }

    .project-info p {
      font-size: 0.8rem;
      color: var(--chalk-dim);
      max-height: 0;
      opacity: 0;
      transition: max-height 0.25s, opacity 0.25s;
    }

    .project:hover,
    .project:focus-visible {
      z-index: 1;
      rotate: 0deg;
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 26px 44px rgba(0, 0, 0, 0.6);
      outline: none;
    }

    .project:hover::before,
    .project:focus-visible::before {
      background-position: 200% 0, 0 0;
      transition: background-position 1s ease-out;
    }

    .project:hover img,
    .project:focus-visible img { transform: scale(1.08); filter: brightness(1.12); }

    .project:hover p,
    .project:focus-visible p { max-height: 2.4em; opacity: 1; }

    /* touch screens: no hover, so always show the descriptor */
    @media (hover: none) {
      .project-info p { max-height: 2.4em; opacity: 1; }
    }

    /* ---------- socials ---------- */
    .socials {
      display: flex;
      gap: 1.5rem;
    }

    .socials a {
      color: var(--chalk-dim);
      transition: color 0.2s, transform 0.3s var(--spring);
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--chalk);
      transform: translateY(-3px) rotate(-8deg);
    }

    .socials svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @keyframes rise {
      from { opacity: 0; translate: 0 16px; }
    }

    @keyframes spin {
      to { rotate: 1turn; }
    }

    @keyframes morph {
      50%  { border-radius: 55% 45% 42% 58% / 44% 55% 45% 56%; }
      100% { border-radius: 48% 52% 58% 42% / 56% 48% 52% 44%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

    </span>
