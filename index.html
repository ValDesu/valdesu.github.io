<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pafan.dev</title>
  <meta name="description" content="Val — I build games and apps from Tokyo." />
  <style>
    :root { --fg: #e8d6c8; --dim: #6b5446; --accent: #ff7a1a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; }
    body {
      font: 11px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--fg);
      letter-spacing: 0.02em;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3rem;
      padding: 2rem;
    }
    header { align-self: flex-start; }
    nav { display: flex; flex-wrap: wrap; gap: 1.5rem clamp(2rem, 8vw, 4rem); align-self: flex-end; max-width: 100%; }
    nav, header { background: #000; padding: 0.5rem 0.75rem; margin: -0.5rem -0.75rem; }
    h1 { font: inherit; letter-spacing: 0.3em; }
    h2 { font: inherit; color: var(--dim); margin-bottom: 0.4rem; }
    p, li { color: var(--dim); list-style: none; }
    a { color: var(--fg); text-decoration: none; }
    h1 { color: var(--accent); }
    a:hover { background: var(--accent); color: #000; }
    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    section { animation: in 1.2s ease both; animation-delay: calc(var(--i) * 0.15s); }
    @keyframes in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { section { animation: none; } }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <main>
    <header>
      <h1>PAFAN.DEV</h1>
      <p>val. games &amp; apps. tokyo.</p>
    </header>
    <nav>
    <section style="--i: 1">
      <h2>[ work ]</h2>
      <ul>
        <li><a href="https://store.steampowered.com/app/4022740/La_Pizza_Del_Gatto/">la pizza del gatto</a></li>
        <li><a href="https://wikifighters.com/">wikifighters</a></li>
        <li><a href="https://meowarts.com/">meow arts</a></li>
      </ul>
    </section>
    <section style="--i: 2">
      <h2>[ elsewhere ]</h2>
      <ul>
        <li><a href="https://github.com/valdesu">github</a></li>
        <li><a href="https://www.linkedin.com/in/valentin-wacheux/">linkedin</a></li>
        <li><a href="mailto:devteam@meowapps.com">email</a></li>
      </ul>
    </section>
    </nav>
  </main>

  <script>
    // lain.gif baked into a vertical strip of grayscale frames (lit = drawing, 0 = background)
    const FW = 128, FH = 72, FRAMES = 18, FRAME_MS = 100, CELL = 24, HALF = CELL / 2, FOCUS_X = 0.27;
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // dim red-orange -> bright amber
    const col = (v, a) => `hsla(${12 + v * 28}, 100%, ${45 + v * 20}%, ${a})`;
    const hex = v => Math.round(v * 255).toString(16).padStart(2, '0').toUpperCase();
    let cols, rows, fcols, cur, idx, split, frames, peak;

    // the image is sampled on a half-size grid; 24px blocks that lain ever touches split into 4 small cells
    function resize() {
      const dpr = devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(innerWidth / CELL);
      rows = Math.ceil(innerHeight / CELL);
      fcols = cols * 2;
      const frows = rows * 2;
      cur = new Float32Array(fcols * frows);
      // cover-fit the 16:9 frame to the fine grid, keeping lain (FOCUS_X) in view
      const s = Math.max(fcols / FW, frows / FH);
      const ox = Math.min(0, Math.max(fcols - FW * s, fcols / 2 - FOCUS_X * FW * s));
      const oy = (frows - FH * s) / 2;
      idx = new Int32Array(fcols * frows);
      for (let y = 0; y < frows; y++) for (let x = 0; x < fcols; x++) {
        const fx = Math.min(FW - 1, Math.max(0, Math.floor((x + 0.5 - ox) / s)));
        const fy = Math.min(FH - 1, Math.max(0, Math.floor((y + 0.5 - oy) / s)));
        idx[y * fcols + x] = fy * FW + fx;
      }
      const hot = new Uint8Array(cols * rows);
      for (let i = 0; i < idx.length; i++) {
        if (peak[idx[i]] > 15) hot[Math.floor(Math.floor(i / fcols) / 2) * cols + Math.floor((i % fcols) / 2)] = 1;
      }
      // grow by one block so the fine area has a soft margin
      split = new Uint8Array(cols * rows);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx >= 0 && yy >= 0 && xx < cols && yy < rows && hot[yy * cols + xx]) split[y * cols + x] = 1;
        }
      }
    }

    function cell(x, y, size, v) {
      if (v > 0.04 && v < 0.2) { // shadows: own low-key crimson so the neck reads against the background
        ctx.strokeStyle = 'hsla(345, 60%, 45%, 0.12)';
        ctx.strokeRect(x + 1.5, y + 1.5, size - 2, size - 2);
        ctx.fillStyle = 'hsla(345, 60%, 50%, 0.4)';
        ctx.fillText(hex(v), x + size / 2, y + size / 2 + 0.5);
        return;
      }
      if (v > 0.02) {
        ctx.strokeStyle = col(v, v * 0.4);
        ctx.strokeRect(x + 1.5, y + 1.5, size - 2, size - 2);
      }
      ctx.fillStyle = col(v, 0.1 + v * 0.85);
      ctx.fillText(hex(v), x + size / 2, y + size / 2 + 0.5);
    }

    const img = new Image();
    img.src = 'img/lain-grid.png';
    img.onload = () => {
      const off = new OffscreenCanvas(FW, FH * FRAMES).getContext('2d');
      off.drawImage(img, 0, 0);
      const px = off.getImageData(0, 0, FW, FH * FRAMES).data;
      frames = Array.from({ length: FRAMES }, (_, f) => {
        const a = new Uint8Array(FW * FH);
        for (let i = 0; i < a.length; i++) a[i] = px[(f * FW * FH + i) * 4];
        return a;
      });
      peak = new Uint8Array(FW * FH);
      for (const f of frames) for (let i = 0; i < f.length; i++) peak[i] = Math.max(peak[i], f[i]);

      resize();
      addEventListener('resize', () => { resize(); if (still) draw(0); });

      function draw(t) {
        const frame = frames[still ? 0 : Math.floor(t / FRAME_MS) % FRAMES];
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        const tt = still ? 0 : t;
        for (let i = 0; i < cur.length; i++) {
          // slow drifting interference waves, 0..1, so flat areas shimmer instead of sitting on one value
          const x = i % fcols, y = (i / fcols) | 0;
          const n = (Math.sin(x * 0.21 + tt * 0.0006) * Math.sin(y * 0.17 - tt * 0.0004) + Math.sin((x + y) * 0.09 + tt * 0.0009)) / 4 + 0.5;
          cur[i] += (frame[idx[i]] / 255 * (0.55 + 0.45 * n) - cur[i]) * (still ? 1 : 0.25); // ease so cells glow rather than blink
        }

        ctx.strokeStyle = 'rgba(255,110,30,0.08)';
        ctx.beginPath();
        for (let b = 0; b < split.length; b++) {
          const x = (b % cols) * CELL + 0.5, y = Math.floor(b / cols) * CELL + 0.5;
          ctx.rect(x, y, CELL, CELL);
          if (split[b]) { ctx.moveTo(x + HALF, y); ctx.lineTo(x + HALF, y + CELL); ctx.moveTo(x, y + HALF); ctx.lineTo(x + CELL, y + HALF); }
        }
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // two passes so the font only changes once per frame
        for (const fine of [false, true]) {
          ctx.font = (fine ? 5 : 7) + 'px ui-monospace, Menlo, monospace';
          for (let b = 0; b < split.length; b++) {
            if (!split[b] !== !fine) continue;
            const bx = b % cols, by = Math.floor(b / cols), f = by * 2 * fcols + bx * 2;
            const v = [cur[f], cur[f + 1], cur[f + fcols], cur[f + fcols + 1]];
            if (fine) v.forEach((s, k) => cell(bx * CELL + (k % 2) * HALF, by * CELL + (k >> 1) * HALF, HALF, s));
            else cell(bx * CELL, by * CELL, CELL, (v[0] + v[1] + v[2] + v[3]) / 4);
          }
        }
        if (!still) requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    };
  </script>
</body>
</html>
